name: "Arctic Spa MQTT Bridge"
version: "0.1.0"
slug: "arctic_spa_bridge"
description: "Reads live telemetry from the Arctic Spa controller's local websocket (port 8765) and republishes it to MQTT with Home Assistant discovery. Read-only: never sends commands to the spa."
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: services
boot: auto
options:
  spa_host: "10.10.30.104"
  spa_ws_port: 8765
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_username: "ha_mqtt"
  mqtt_password: ""
  poll_interval_seconds: 30
schema:
  spa_host: str
  spa_ws_port: port
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str
  mqtt_password: password
  poll_interval_seconds: int(5,300)
